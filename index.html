<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Предел тишины</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', 'Roboto', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #game {
            position: relative;
            max-width: 1000px;
            width: 100%;
            min-height: 500px;
            background-color: rgba(0, 0, 0, 0.75);
            background-blend-mode: overlay;
            border-radius: 28px;
            padding: 30px 40px 40px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            transition: background-image 0.5s ease;
            color: #f0f0f0;
        }
        .bg-ruins { background-image: url('images/image.jpg'); background-size: cover; background-position: center; }
        .bg-hospital { background-image: url('images/hospital.jpg'); background-size: cover; background-position: center; }
        .bg-base { background-image: url('images/base.jpg'); background-size: cover; background-position: center; }
        .bg-safe { background-image: url('images/base.jpg'); background-size: cover; }
        .bg-default { background-image: none; background-color: #111; }
        .dialogue-box {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 20px 28px;
            margin-top: 20px;
            border-left: 5px solid #e67e22;
            font-size: 1.2rem;
            line-height: 1.5;
        }
        .speaker {
            font-size: 0.9rem;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .choices-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .choice-btn {
            background: linear-gradient(95deg, #2c3e50, #1a2632);
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            color: #ecf0f1;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }
        .choice-btn:hover {
            background: linear-gradient(95deg, #e67e22, #c0392b);
            transform: translateX(8px);
        }
        .trust-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.7rem;
            background: #00000066;
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div id="game" class="bg-ruins">
    <div class="dialogue-box">
        <div class="speaker" id="speakerName">Артём</div>
        <div id="dialogueText">Загрузка...</div>
    </div>
    <div class="choices-container" id="choicesContainer"></div>
    <div class="trust-badge" id="trustDisplay"></div>
</div>

<script>
    let gameState = { trust_irina: 0, trust_misha: 0, evidence: false, side: "neutral" };
    function updateTrustUI() {
        let el = document.getElementById("trustDisplay");
        if (el) el.innerText = `Ирина: ${gameState.trust_irina} | улики: ${gameState.evidence}`;
    }

    const scenes = {
        start: {
            speaker: "Артём", text: "Я очнулся в груде бетона. Голова гудит. Рядом ни души, только ветер и хрип заражённых.",
            background: "bg-ruins",
            choices: [
                { text: "Осмотреться и позвать группу", next: "find_group" },
                { text: "Попытаться вспомнить", next: "memory_fragments" }
            ]
        },
        find_group: {
            speaker: "Артём", text: "Из-за обломков появляются Ирина и Миша. Ирина: «Ты жив… чудо!»",
            background: "bg-ruins",
            choices: [
                { text: "Спросить, что произошло", next: "ask_what", actions: () => gameState.trust_irina++ },
                { text: "Кивнуть и идти дальше", next: "silent_walk", actions: () => gameState.trust_irina-- }
            ]
        },
        memory_fragments: {
            speaker: "Артём", text: "Вспышка: баррикады у больницы, крики. Вирус мутировал.",
            background: "bg-ruins",
            choices: [
                { text: "Пойти в аптеку", next: "pharmacy" },
                { text: "Искать подвал", next: "basement" }
            ]
        },
        ask_what: {
            speaker: "Ирина", text: "Вирус мутировал. Заражённые почти не спят. Нам нужны медикаменты.",
            background: "bg-ruins",
            choices: [
                { text: "Пойти в аптеку", next: "pharmacy" },
                { text: "Уйти в подвал", next: "basement" }
            ]
        },
        silent_walk: {
            speaker: "Ирина", text: "— Ты как? Артём молчит. Ирина вздыхает: «Ладно, идём.»",
            background: "bg-ruins",
            choices: [
                { text: "Направиться в аптеку", next: "pharmacy" },
                { text: "Спуститься в подвал", next: "basement" }
            ]
        },
        pharmacy: {
            speaker: "Артём", text: "В аптеке разгром, но есть антибиотики и бинты. Ирина: «Этого хватит на неделю.»",
            background: "bg-hospital",
            choices: [ { text: "Вернуться в убежище", next: "strange_findings", actions: () => gameState.trust_irina++ } ]
        },
        basement: {
            speaker: "Миша", text: "В подвале сыро, но есть консервы и вода. Ирина: «Риск не оправдан.»",
            background: "bg-default",
            choices: [ { text: "Осмотреть подвал", next: "strange_findings", actions: () => gameState.trust_irina-- } ]
        },
        strange_findings: {
            speaker: "Миша", text: "Я нашёл военный планшет! Карта с идеально ровными секторами заражения.",
            background: "bg-default",
            choices: [
                { text: "Включить планшет", next: "tablet_on", actions: () => { gameState.evidence = true; gameState.trust_irina++; } },
                { text: "Выбросить", next: "tablet_off", actions: () => gameState.trust_irina-- }
            ]
        },
        tablet_on: {
            speaker: "Артём", text: "Экран: «Объект Чистилище. Периметр стабилен. Потери – 97%». Ирина: «Нас изолировали специально?»",
            background: "bg-default",
            choices: [ { text: "Идти к границе зоны", next: "border" } ]
        },
        tablet_off: {
            speaker: "Ирина", text: "— Выброси, это военное. Артём колеблется, но швыряет планшет.",
            background: "bg-default",
            choices: [ { text: "Всё равно проверить границу", next: "border" } ]
        },
        border: {
            speaker: "Артём", text: "Заражённые пропадают. Высокий забор под напряжением, за ним огни города.",
            background: "bg-default",
            choices: [
                { text: "Перелезть через забор", next: "cross" },
                { text: "Найти КПП", next: "checkpoint" }
            ]
        },
        cross: {
            speaker: "Артём", text: "Патруль: «Нарушители! Вернитесь!» Артём: «Это геноцид!»",
            background: "bg-default",
            choices: [ { text: "Проследить за военными", next: "base_raid" } ]
        },
        checkpoint: {
            speaker: "Офицер", text: "— Вы из контейнера? Вирус рукотворный? Я ничего не подтверждаю.",
            background: "bg-default",
            choices: [ { text: "Проследить до базы", next: "base_raid", actions: () => gameState.evidence = true } ]
        },
        base_raid: {
            speaker: "Учёный", text: "Вирус «Молчание» — искусственный. Спецназ идёт! Бегите!",
            background: "bg-base",
            choices: [
                { text: "Спасти данные", next: "save_data", actions: () => { gameState.evidence = true; gameState.side = "resistance"; } },
                { text: "Спасать группу", next: "save_group", actions: () => gameState.side = "neutral" }
            ]
        },
        save_data: {
            speaker: "Артём", text: "Хватаю жёсткий диск. Прорываемся. Начинается мировой скандал.",
            background: "bg-default",
            choices: [ { text: "Дальше", next: "final" } ]
        },
        save_group: {
            speaker: "Артём", text: "Бросаем всё, уходим в туннели. Мир скатывается в войну.",
            background: "bg-default",
            choices: [ { text: "Дальше", next: "final" } ]
        },
        final: {
            speaker: "Система", text: "Война полыхает. Последний выбор.",
            background: "bg-default",
            choices: []
        }
    };

    function getEnding() {
        if (gameState.side === "neutral" || (gameState.trust_irina >= 1 && !gameState.evidence)) {
            return { speaker: "Артём", text: "Мы уходим в горы. Где-то далеко бомбы, но здесь тишина.", background: "bg-safe", choices: [{text:"Начать заново", next:"start"}] };
        } else if (gameState.side === "resistance" || gameState.evidence) {
            return { speaker: "Артём", text: "Правда всплыла. Моё имя на мемориале.", background: "bg-base", choices: [{text:"Начать заново", next:"start"}] };
        } else {
            return { speaker: "Артём", text: "Меня ловят. Миша умирает...", background: "bg-default", choices: [{text:"Начать заново", next:"start"}] };
        }
    }

    let currentSceneId = "start";
    function renderScene(id) {
        let scene = (id === "final") ? getEnding() : scenes[id];
        if (!scene) scene = scenes.start;
        const gameDiv = document.getElementById("game");
        gameDiv.className = scene.background || "bg-default";
        document.getElementById("speakerName").innerText = scene.speaker;
        document.getElementById("dialogueText").innerText = scene.text;
        const container = document.getElementById("choicesContainer");
        container.innerHTML = "";
        if (scene.choices && scene.choices.length) {
            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => {
                    if (choice.actions) choice.actions();
                    currentSceneId = choice.next;
                    updateTrustUI();
                    renderScene(currentSceneId);
                };
                container.appendChild(btn);
            });
        } else {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = "Начать заново";
            btn.onclick = () => { resetGame(); renderScene("start"); };
            container.appendChild(btn);
        }
        updateTrustUI();
    }
    function resetGame() {
        gameState = { trust_irina: 0, trust_misha: 0, evidence: false, side: "neutral" };
        currentSceneId = "start";
        updateTrustUI();
    }
    window.onload = () => { resetGame(); renderScene("start"); };
</script>
</body>
</html>
