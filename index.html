<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест новеллы</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; padding: 20px; }
        #game { max-width: 800px; margin: 0 auto; background: #222; padding: 20px; border-radius: 20px; }
        button { display: block; margin: 10px 0; padding: 10px; background: #e67e22; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div id="game">
    <div id="dialogue">Загрузка...</div>
    <div id="choices"></div>
</div>
<script>
    let step = 0;
    const scenes = [
        { text: "Вы очнулись в руинах. Что делать?", choices: ["Осмотреться", "Позвать на помощь"] },
        { text: "Вы нашли аптечку. Выбор сделан.", choices: ["Начать заново"] }
    ];
    function update() {
        let s = scenes[step];
        document.getElementById("dialogue").innerText = s.text;
        let html = "";
        for (let i = 0; i < s.choices.length; i++) {
            html += `<button onclick="next(${i})">${s.choices[i]}</button>`;
        }
        document.getElementById("choices").innerHTML = html;
    }
    function next(choice) {
        if (step === 0) step = 1;
        else step = 0;
        update();
    }
    update();
</script>
</body>
</html>
