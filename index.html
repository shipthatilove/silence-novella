<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Предел тишины</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
        #game { position: relative; max-width: 800px; margin: 0 auto; padding: 20px; background: rgba(0,0,0,0.7); border-radius: 15px; min-height: 400px; }
        #dialogue { font-size: 1.2em; margin-bottom: 20px; }
        .choice-btn {
    display: block;
    width: 80%;
    margin: 10px auto;
    padding: 12px 20px;
    background: linear-gradient(135deg, #2c3e50, #1a2632);
    color: #ecf0f1;
    border: none;
    border-radius: 40px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    letter-spacing: 1px;
}

.choice-btn:hover {
    background: linear-gradient(135deg, #e67e22, #d35400);
    transform: scale(1.02);
    box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    color: white;
}

.choice-btn:active {
    transform: scale(0.98);
}
        @keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#choices button {
    animation: fadeInUp 0.4s ease backwards;
}
        /* Фоны для разных сцен */
.bg-ruins { background-image: url('images/stree_ruins.jpg'); background-size: cover; background-position: center; }
.bg-hospital { background-image: url('images/hospital.jpg'); background-size: cover; background-position: center; }
.bg-base { background-image: url('images/base.jpg'); background-size: cover; background-position: center; }
    </style>
</head>
